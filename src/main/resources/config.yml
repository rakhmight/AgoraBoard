# AgoraBoard - настройки / settings
#
# Язык и тексты / language and texts:
#   Все сообщения, подписи в меню, ПРЕФИКС плагина и цвета лежат в файлах
#   plugins/AgoraBoard/lang/<язык>.yml (формат MiniMessage: <red>, <#ff8800>,
#   <gradient:gold:yellow>...</gradient>). Готовые файлы: ru, en.
#   Свой язык: скопируйте ru.yml в, например, de.yml, переведите и укажите language: de.
#   Применить изменения без перезапуска: /board admin reload
language: ru
#
# Режим обмена / trade mode:
#   GUI     - обмен проходит автоматически через меню. Предмет из руки игрока
#             замораживается на доске, пока обмен не состоится или не будет отменён.
#   NATURAL - меню только показывает объявления об обмене, игроки обмениваются
#             сами (предметы никуда не списываются).
trade-mode: GUI

# Пауза между созданием объявлений одним игроком (секунды). 0 - без паузы.
create-cooldown-seconds: 20

# Команда личных сообщений (без /). Её подставляют кнопки [написать] у объявлений.
# Если у вас свой плагин, укажите его команду, например tell, w, m, pm.
message-command: msg

# Писать игроку в чат при входе, сколько объявлений и обменов сейчас на доске.
# false - не показывать эту строку совсем.
# (Напоминание "вас ждут предметы за обмен" к этой настройке не относится
# и показывается всегда: оно про вещи самого игрока.)
notify-on-join: true

# Слова, запрещённые в тексте объявлений (без учёта регистра).
blocked-words: []

ads:
  # Максимум одновременных объявлений у одного игрока.
  max-per-player: 2
  # Через сколько дней объявление исчезает само. Игрок может удалить его раньше.
  duration-days: 10
  min-length: 3
  max-length: 150
  # Цена размещения объявления. 0 - бесплатно, и цена нигде не показывается.
  price: 0

trades:
  # Максимум одновременных обменов у одного игрока.
  max-per-player: 5
  # Цена размещения обмена. 0 - бесплатно, и цена нигде не показывается.
  price: 0
  # Деньги вместо предметов (или вместе с ними): игрок отдаёт за нужный предмет сумму,
  # например /board trade diamond 5 money 250. Нужен Vault + плагин экономики.
  # В режиме GUI сумма списывается и резервируется сразу при создании обмена, возвращается
  # при отмене или истечении срока и переходит принявшему обмен при его принятии.
  # В режиме NATURAL и в договорных обменах сумма только показывается, ничего не списывается.
  money:
    enabled: true
    # Допустимая сумма в одном обмене (max: 0 - без верхнего предела).
    min: 1
    max: 0
  # Срок жизни обмена в днях. 0 - пока игрок не отменит. По истечении срока
  # замороженный предмет возвращается владельцу.
  duration-days: 10
  # Сколько разных предметов можно отдавать в одном обмене.
  max-offers: 5
  # Максимальная длина описания обмена (зачарования, условия...). 0 - без описания.
  max-description: 100
  # Максимальное количество одного предмета в обмене (2304 = 36 стаков по 64).
  max-amount: 2304
  # Показывать окно подтверждения перед обменом (в режиме GUI).
  confirm-gui: true

# Экономика. Цены работают через Vault + любой плагин экономики (EssentialsX, CMI...).
# Если Vault или плагина экономики нет, все цены отключаются (в консоль пишется
# предупреждение), а в меню и сообщениях стоимость не показывается.
# Игроки с правом agoraboard.unlimited платят 0 и не ждут кулдауны.
economy:
  enabled: true

# Публикация своих объявлений и обменов в общий чат.
# Игрок делает это командой с флагом -c (/board ad -c help текст) или кнопкой
# в меню по клику на своё объявление; там же повторная публикация.
chat:
  enabled: true
  # Как объявление попадает в чат. Если на сервере есть плагины чата
  # (EssentialsX Chat, ChatControl, DeluxeChat, VentureChat...), выберите подходящий режим:
  #   BROADCAST - плагин сам отправляет всем оформленное сообщение (тексты из lang/*.yml,
  #               кликабельные кнопки). Чат-плагины его не видят: свои форматы, каналы и
  #               фильтры не применяются. Работает всегда.
  #   COMMAND   - плагин выполняет от имени консоли команды из списка commands, например
  #               команду объявлений вашего чат-плагина. Текст передаётся без цветов.
  #               Плейсхолдеры: {player} {category} {text} {message}
  #               ({text} - текст объявления или описание, {message} - готовая строка
  #               вида "[Объявление | Помощь] Ник: текст"). Из текста игрока вырезаются
  #               символы % и &, чтобы нельзя было подсунуть плейсхолдеры и цвета.
  #   PLAYER    - сообщение отправляется от имени самого игрока через обычный чат: чат-плагин
  #               оформляет его префиксами/форматом, но действуют его правила (локальный чат,
  #               каналы, мут, антиспам), и сообщение может дойти не до всех.
  mode: BROADCAST
  # Команды для режима COMMAND (по одной на строку, без /). Примеры:
  #   - "broadcast {message}"          (EssentialsX)
  #   - "say {message}"                (ваниль)
  #   - "chc broadcast {message}"      (ChatControl, проверьте синтаксис своей версии)
  commands:
    - "broadcast {message}"
  # Цена одной публикации в чат (первой и каждой повторной).
  #   0  - бесплатно, но не чаще, чем раз в cooldown-minutes
  #        (общая пауза на все объявления и обмены игрока);
  #   >0 - платно, пауза не действует.
  price: 0
  cooldown-minutes: 30

# Категории объявлений. id - то, что игрок вводит в команде.
# name - название (формат MiniMessage), icon - предмет в меню.
categories:
  help:
    name: "<green>Помощь"
    icon: GOLDEN_APPLE
  party:
    name: "<gold>Сбор людей"
    icon: IRON_SWORD
  news:
    name: "<aqua>Новости"
    icon: WRITTEN_BOOK
  other:
    name: "<gray>Прочее"
    icon: PAPER
