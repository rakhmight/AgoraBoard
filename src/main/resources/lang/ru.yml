        - ""
        - "<gray>На доске: <white><total>"
        - "<gray>Ваших: <white><mine>/<max>"
        - ""
        - "<yellow>Нажмите, чтобы открыть"
    claim:
      name: "<aqua><bold>Получить предметы"
      lore:
        - "<gray>Вас ждут предметы: <white><amount>"
        - ""
        - "<yellow>Нажмите, чтобы открыть"

  claim:
    title: "<dark_gray>Получение предметов"
    empty: "<red>Здесь пока пусто"
    empty-lore:
      - "<gray>Сюда попадают предметы за"
