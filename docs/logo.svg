<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a8f72"/><stop offset="1" stop-color="#0d3b3f"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#e0a416"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- wooden frame and cork -->
  <rect x="64" y="84" width="384" height="344" rx="30" fill="#7a4d24" filter="url(#sh)"/>
  <rect x="82" y="102" width="348" height="308" rx="18" fill="#d29d62"/>
  <g opacity=".18" fill="#6b4220"><circle cx="120" cy="140" r="4"/><circle cx="380" cy="130" r="3"/><circle cx="150" cy="370" r="4"/><circle cx="260" cy="385" r="3"/><circle cx="410" cy="300" r="4"/><circle cx="102" cy="260" r="3"/></g>
  <!-- note 1: announcement -->
  <g transform="rotate(-6 190 190)" filter="url(#sh)">
    <rect x="112" y="124" width="150" height="134" rx="6" fill="#fff6dc"/>
    <rect x="128" y="150" width="96" height="9" rx="4" fill="#b9a67a"/>
    <rect x="128" y="172" width="118" height="9" rx="4" fill="#cdbf9b"/>
    <rect x="128" y="194" width="104" height="9" rx="4" fill="#cdbf9b"/>
    <rect x="128" y="216" width="70" height="9" rx="4" fill="#cdbf9b"/>
    <circle cx="187" cy="134" r="11" fill="#d93a3a"/><circle cx="184" cy="131" r="3.5" fill="#ff9a9a"/>
  </g>
  <!-- note 2: trade -->
  <g transform="rotate(5 340 200)" filter="url(#sh)">
    <rect x="266" y="118" width="148" height="128" rx="6" fill="#e3f1ff"/>
    <rect x="282" y="146" width="40" height="40" rx="6" fill="#58d6e8"/>
    <path d="M302 154 l12 10 -12 18 -12 -18z" fill="#e9fdff" opacity=".9"/>
    <path d="M334 160h34m-9-9 9 9-9 9" stroke="#3a5f8a" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M370 188h-34m9-9-9 9 9 9" stroke="#3a5f8a" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 4)"/>
    <rect x="282" y="206" width="104" height="9" rx="4" fill="#9db9d6"/>
    <circle cx="340" cy="128" r="11" fill="#2f7be0"/><circle cx="337" cy="125" r="3.5" fill="#9cc6ff"/>
  </g>
  <!-- note 3 -->
  <g transform="rotate(-3 200 330)" filter="url(#sh)">
    <rect x="116" y="284" width="170" height="104" rx="6" fill="#e6f7d8"/>
    <rect x="132" y="308" width="110" height="9" rx="4" fill="#9cc287"/>
    <rect x="132" y="330" width="136" height="9" rx="4" fill="#b6d8a2"/>
    <rect x="132" y="352" width="84" height="9" rx="4" fill="#b6d8a2"/>
    <circle cx="201" cy="294" r="11" fill="#2fb36b"/><circle cx="198" cy="291" r="3.5" fill="#a5f0c4"/>
  </g>
  <!-- gold coin: money in trades -->
  <g filter="url(#sh)">
    <circle cx="352" cy="334" r="70" fill="#b87b0a"/>
    <circle cx="352" cy="330" r="70" fill="url(#coin)"/>
    <circle cx="352" cy="330" r="55" fill="none" stroke="#b87b0a" stroke-width="5" opacity=".7"/>
    <path d="M352 296v68m-20-54c0-9 9-14 20-14s20 5 20 14-9 12-20 14-20 5-20 14 9 14 20 14 20-5 20-14" fill="none" stroke="#8a5a06" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
